[project]
name = "linkblog-commons"
version = "0.0.0"
description = "Shared linkblog/link-post library for home-lab blog projects — a normalized link+commentary content type, kept separate from long-form posts. Scaffold; each submodule implemented on first real use."
requires-python = ">=3.11"
dependencies = ["feedgen>=1.0.0,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-socket>=0.7", "ruff==0.16.1", "mypy>=1.13", "mutmut>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkblog_commons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-socket", "--strict-markers", "--strict-config", "-ra"]
markers = [
    "network: tests requiring live internet access",
]

[tool.mutmut]
paths_to_mutate = ["src/linkblog_commons/"]
tests_dir = ["tests/"]
runner = ".venv/bin/pytest -x -q"

[tool.ruff]
line-length = 100
# Pack checkers in scripts/ are copied unchanged from the stack packs.
extend-exclude = ["scripts/*.py", "docs"]

[tool.ruff.lint]
# Pinned on purpose: ruff's default set changes between releases. An empty ignore list means
# every exception is a decision made in a code comment (# noqa: CODE -- reason), not in config.
select = [
  "E", "F", "I", "N", "UP",
  "S", "B", "BLE",
  "ASYNC",
  "ANN",
  "T20",
  "G",
  "PGH", "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S314", "S603"]

[tool.mypy]
strict = true
files = ["src"]
