[project]
name = "linkblog-commons"
version = "0.0.0"
description = "Shared linkblog/link-post library for home-lab blog projects — a normalized link+commentary content type, kept separate from long-form posts. Scaffold; each submodule implemented on first real use."
requires-python = ">=3.11"
dependencies = ["feedgen>=1.0.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-socket>=0.7"]
dev = ["ruff==0.16.1", "mutmut>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkblog_commons"]

[tool.pytest.ini_options]
addopts = "--disable-socket"
markers = [
    "network: tests requiring live internet access",
]

[tool.mutmut]
paths_to_mutate = ["src/linkblog_commons/"]
tests_dir = ["tests/"]
runner = ".venv/bin/pytest -x -q"

[tool.ruff.lint]
# Pin the rule set explicitly. With no select, ruff applies its own default,
# which has widened across releases -- a ruff upgrade alone could then turn CI
# red with no change here. This is ruff's long-standing default, written down.
select = ["E4", "E7", "E9", "F"]
